<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg 
  width="1024" 
  height="1024" 
  viewBox="0 0 100 100" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
  style="filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.2));"
>
  <!-- Cancer cell shaped background with irregular edges -->
  <path 
    d="M50,5 
    C60,5 70,8 78,15 
    C85,20 91,25 94,35
    C97,40 99,47 95,55
    C99,65 97,73 92,82
    C87,90 80,96 70,95
    C65,99 55,97 48,95
    C40,98 30,96 22,90
    C14,85 7,78 5,68
    C3,60 2,50 5,42
    C2,35 5,25 10,18
    C15,12 23,5 35,5
    C40,3 45,5 50,5" 
    fill="url(#bgGradient)" 
  />
  
  <!-- Data pattern overlay -->
  <path 
    d="M50,5 
    C60,5 70,8 78,15 
    C85,20 91,25 94,35
    C97,40 99,47 95,55
    C99,65 97,73 92,82
    C87,90 80,96 70,95
    C65,99 55,97 48,95
    C40,98 30,96 22,90
    C14,85 7,78 5,68
    C3,60 2,50 5,42
    C2,35 5,25 10,18
    C15,12 23,5 35,5
    C40,3 45,5 50,5" 
    fill="url(#dataPattern)" 
    opacity="0.15"
  />
  
  <!-- Subtle glow effect following the cancer cell shape -->
  <path 
    d="M50,8 
    C59,8 68,10 75,16 
    C82,21 87,25 90,34
    C93,39 94,45 91,52
    C94,61 93,68 89,76
    C85,83 79,88 70,88
    C66,91 57,90 51,88
    C44,90 35,89 28,84
    C21,80 15,74 13,65
    C12,58 10,49 13,42
    C10,36 13,28 17,22
    C21,17 28,11 38,10
    C42,8 46,8 50,8" 
    stroke="rgba(255, 255, 255, 0.3)" 
    stroke-width="2" 
    fill="none" 
  />
  
  <!-- KNN Graph Representation - Nodes -->
  <circle cx="30" cy="30" r="4" fill="#ffffff" filter="url(#glowFilter)" />
  <circle cx="45" cy="25" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="60" cy="35" r="3.5" fill="#ffffff" opacity="0.9" />
  <circle cx="65" cy="55" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="55" cy="70" r="3.5" fill="#ffffff" opacity="0.9" />
  <circle cx="35" cy="65" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="25" cy="50" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="50" cy="50" r="5" fill="url(#cellGradient)" stroke="white" stroke-width="1" filter="url(#glowFilter)" />
  
  <!-- KNN Graph Representation - Connections -->
  <g class="knn-edges">
    <!-- Connections from central node to all other nodes -->
    <line x1="50" y1="50" x2="30" y2="30" stroke="white" stroke-width="1" opacity="0.7" />
    <line x1="50" y1="50" x2="45" y2="25" stroke="white" stroke-width="1" opacity="0.6" />
    <line x1="50" y1="50" x2="60" y2="35" stroke="white" stroke-width="1" opacity="0.7" />
    <line x1="50" y1="50" x2="65" y2="55" stroke="white" stroke-width="1" opacity="0.6" />
    <line x1="50" y1="50" x2="55" y2="70" stroke="white" stroke-width="1" opacity="0.7" />
    <line x1="50" y1="50" x2="35" y2="65" stroke="white" stroke-width="1" opacity="0.6" />
    <line x1="50" y1="50" x2="25" y2="50" stroke="white" stroke-width="1" opacity="0.7" />
    
    <!-- K-nearest connections between nodes -->
    <line x1="30" y1="30" x2="45" y2="25" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="45" y1="25" x2="60" y2="35" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="60" y1="35" x2="65" y2="55" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="65" y1="55" x2="55" y2="70" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="55" y1="70" x2="35" y2="65" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="35" y1="65" x2="25" y2="50" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
    <line x1="25" y1="50" x2="30" y2="30" stroke="white" stroke-width="0.8" opacity="0.5" stroke-dasharray="1,2" />
  </g>
  
  <!-- Secondary connections to show clustering -->
  <line x1="30" y1="30" x2="60" y2="35" stroke="white" stroke-width="0.5" opacity="0.3" stroke-dasharray="1,3" />
  <line x1="45" y1="25" x2="55" y2="70" stroke="white" stroke-width="0.5" opacity="0.3" stroke-dasharray="1,3" />
  <line x1="25" y1="50" x2="65" y2="55" stroke="white" stroke-width="0.5" opacity="0.3" stroke-dasharray="1,3" />
  
  <!-- Analysis boundary around the KNN graph -->
  <circle 
    cx="50" 
    cy="50" 
    r="30" 
    stroke="white" 
    stroke-width="1" 
    stroke-dasharray="2,3" 
    fill="none" 
    opacity="0.4" 
  />
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="40%" stop-color="#0891D5" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#026DA9" />
    </linearGradient>
    
    <radialGradient id="cellGradient" cx="50%" cy="50%" r="70%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#60D88A" />
      <stop offset="60%" stop-color="#40B876" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </radialGradient>
    
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Data pattern texture -->
    <pattern id="dataPattern" patternUnits="userSpaceOnUse" width="50" height="50" patternTransform="scale(0.5)">
      <rect width="50" height="50" fill="none"/>
      <path d="M0 0L10 10M20 0L30 10M40 0L50 10M0 20L10 30M20 20L30 30M40 20L50 30M0 40L10 50M20 40L30 50M40 40L50 50" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    </pattern>
  </defs>
</svg>
